
spring:
  application:
    name: userService
  datasource:
    url: ${DB_URL:jdbc:h2:mem:postgres}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
    show-sql: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083